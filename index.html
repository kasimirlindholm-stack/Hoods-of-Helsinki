<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171a18"><meta name="mobile-web-app-capable" content="yes"><title>Hoods of Helsinki</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="style.css?v=11"></head><body><main><header><h1>HOODS OF HELSINKI <small>BUILD 11</small></h1><div id="hud"><span id="place">TORPPARINMÄKI</span><span>LV <b id="lvl">1</b></span><span>HP <b id="hp">30</b>/30</span><span>€ <b id="cash">12</b></span></div></header><canvas id="game" width="480" height="320"></canvas><button id="installApp" hidden>⬇ ASENNA PELI</button><div id="message">Torpparinmäki. Täällä ei tapahdu mitään. Ja juuri siksi täällä on hyvä olla.</div><div class="mobile-ui"><div id="joy"><div id="stick"></div></div><button id="act">A</button></div><div id="battle" class="hidden"><div class="panel"><h2 id="enemyName"></h2><div id="enemyArt"></div><p>HP <span id="enemyHp"></span></p><div class="actions"><button id="attack">HYÖKKÄÄ</button><button id="talk">PUHU</button><button id="run">PAKENE</button></div><p id="battleLog"></p></div></div></main><script src="game.js?v=11"></script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=11',{updateViaCache:'none'}).then(r=>r.update()))};let installPrompt=null;const ib=document.querySelector('#installApp');addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;ib.hidden=false});ib.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;ib.hidden=true});addEventListener('appinstalled',()=>{ib.hidden=true;installPrompt=null})</script></body></html>
